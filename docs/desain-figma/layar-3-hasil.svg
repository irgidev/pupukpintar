<text x="36" y="560" font-family='Plus Jakarta Sans', 'Segoe UI', sans-serif font-size="11" font-weight="700" fill="#55635A" text-anchor="start">PENJELASAN SEDERHANA</text>
<text x="36" y="584" font-family='Plus Jakarta Sans', 'Segoe UI', sans-serif font-size="13" font-weight="400" fill="#1D241F" text-anchor="start">Dosis N sedang karena stok nitrogen lahan Anda</text>
<text x="36" y="603" font-family='Plus Jakarta Sans', 'Segoe UI', sans-serif font-size="13" font-weight="400" fill="#1D241F" text-anchor="start">sedang. P dinaikkan karena tanah masam sehingga</text>
<text x="36" y="622" font-family='Plus Jakarta Sans', 'Segoe UI', sans-serif font-size="13" font-weight="400" fill="#1D241F" text-anchor="start">fosfor mudah terikat. K dinaikkan karena stok kalium</text>
<text x="36" y="641" font-family='Plus Jakarta Sans', 'Segoe UI', sans-serif font-size="13" font-weight="400" fill="#1D241F" text-anchor="start">lahan rendah. Target hasil 6 ton/ha ikut menaikkan</text>
<text x="36" y="660" font-family='Plus Jakarta Sans', 'Segoe UI', sans-serif font-size="13" font-weight="400" fill="#1D241F" text-anchor="start">kebutuhan hara.</text>
